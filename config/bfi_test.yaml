# --- 其他参数 ---
system_prompt : >-
  Here are a number of characteristics that may or may not apply to you.
  For example, do you agree that you are someone who likes to spend time with others?
  Please select a number from 1~5 for each statement to indicate the extent to which you agree or disagree with that statement.
  The following are the scoring criteria:
  1. Disagree strongly
  2. Disagree a little
  3. Neither agree nor disagree
  4. Agree a little
  5. Agree strongly

